name: Palestine & Gaza News AI Bot

on:
  schedule:
    # Hourly collection of incoming news: at minute 15 of every hour
    - cron: '15 * * * *'
    # Twice daily synthesis & Google Drive batch release: 05:00 and 17:00 UTC
    - cron: '0 5,17 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pipeline execution mode'
        required: true
        default: 'batch'
        type: choice
        options:
          - batch
          - collect
          - dry-run
          - test-feeds
      batch_size:
        description: 'Number of stories in batch'
        required: false
        default: '5'
      generate_images:
        description: 'Generate FLUX illustrations'
        required: false
        default: true
        type: boolean

concurrency:
  group: palestine-news-bot-execution
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine Pipeline Mode
        id: get-mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT
            echo "batch_size=${{ inputs.batch_size }}" >> $GITHUB_OUTPUT
            echo "images=${{ inputs.generate_images }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 5,17 * * *" ]; then
            echo "mode=batch" >> $GITHUB_OUTPUT
            echo "batch_size=5" >> $GITHUB_OUTPUT
            echo "images=true" >> $GITHUB_OUTPUT
          else
            echo "mode=collect" >> $GITHUB_OUTPUT
            echo "batch_size=5" >> $GITHUB_OUTPUT
            echo "images=false" >> $GITHUB_OUTPUT
          fi

      - name: Execute Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          MODE="${{ steps.get-mode.outputs.mode }}"
          BATCH_SIZE="${{ steps.get-mode.outputs.batch_size }}"
          IMAGES="${{ steps.get-mode.outputs.images }}"
          
          CMD="python -m src.pipeline --mode $MODE --batch-size $BATCH_SIZE"
          if [ "$IMAGES" = "false" ]; then
            CMD="$CMD --no-images"
          fi
          
          echo "Running command: $CMD"
          eval $CMD

      - name: Commit Durable Story State
        if: steps.get-mode.outputs.mode != 'dry-run' && steps.get-mode.outputs.mode != 'test-feeds'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state/processed_stories.json state/pending_queue.json || true
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore(bot): update processed and pending story state [skip ci]"
            git push
          fi
